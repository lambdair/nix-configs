name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci-heavy:
    # macos-15 is an Apple Silicon runner, matching ci-heavy's aarch64-darwin
    # package set. Public repo => this macOS runner is free.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: lambdair
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # Left to the explicit step below; see its comment.
          skipPush: true
      # Build only ci-heavy, never a flake-wide command: this attribute
      # references no private input, so the runner needs no sr.ht credentials.
      - id: build
        run: echo "path=$(nix build .#ci-heavy --print-out-paths --print-build-logs)" >> "$GITHUB_OUTPUT"
      # cachix-action's own push uploads every store path the job created, and
      # most of those are build-time intermediates no host ever substitutes.
      # Uploading the closure alone keeps the cache within its storage quota.
      # The pin is what protects it from the cache's garbage collection.
      - name: Push and pin the closure
        run: |
          cachix push lambdair "${{ steps.build.outputs.path }}"
          cachix pin lambdair ci-heavy-aarch64-darwin "${{ steps.build.outputs.path }}" \
            --keep-revisions 2

  ci-heavy-linux:
    # The x86_64-linux half of the same aggregate: NixHome and WSLHome build
    # from these identical derivations. Only the custom packages, not a whole
    # configuration, whose closure does not fit a Linux runner's free disk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: lambdair
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
      - id: build
        run: echo "path=$(nix build .#ci-heavy --print-out-paths --print-build-logs)" >> "$GITHUB_OUTPUT"
      - name: Push and pin the closure
        run: |
          cachix push lambdair "${{ steps.build.outputs.path }}"
          cachix pin lambdair ci-heavy-x86_64-linux "${{ steps.build.outputs.path }}" \
            --keep-revisions 2

  configs:
    # The Linux configurations reference no private input either, so they can
    # be resolved here. --dry-run evaluates the whole configuration and prints
    # what it would build without building it: that catches renamed options and
    # packages dropped from nixpkgs — the way an input bump normally breaks
    # this repo — without paying for a full closure on every run. It does not
    # catch a package that merely fails to compile.
    #
    # The darwin configurations cannot be covered: both pull in the private
    # input, which no runner can fetch. They share ./home with NixHome, so most
    # of their surface is still exercised here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: lambdair
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # Only here to substitute, so --dry-run reports what a host would
          # really have to build. This job produces nothing worth uploading.
          skipPush: true
      - name: Resolve configurations
        run: |
          for attr in \
            homeConfigurations.NixHome.activationPackage \
            homeConfigurations.WSLHome.activationPackage \
            nixosConfigurations.NixOS.config.system.build.toplevel \
            nixosConfigurations.WSL.config.system.build.toplevel
          do
            echo "::group::$attr"
            nix build --dry-run ".#$attr" --print-build-logs
            echo "::endgroup::"
          done
