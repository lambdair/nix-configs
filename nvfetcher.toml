# Upstream helix, tracked only for languages that helix-steel's fork predates
# (currently moonbit). Both the tree-sitter grammar and the queries are taken
# from this single pin so they can never drift out of sync with each other.
# Removable once helix-steel's fork ships moonbit itself.
[helix-mainline]
src.git = "https://github.com/helix-editor/helix"
src.branch = "master"
fetch.github = "helix-editor/helix"

[steel]
src.git = "https://github.com/mattwparas/steel"
fetch.github = "mattwparas/steel"

[sulafat]
src.git = "https://git.sr.ht/~lambdair/sulafat"
src.branch = "main"
fetch.git = "https://git.sr.ht/~lambdair/sulafat"

# nrepl.hx (sulafat) cog dependencies. Forge would install these to
# ~/.steel/cogs/; under Nix we vendor them explicitly. Pinned to the exact SHAs
# sulafat's cog.scm declares so they stay in lockstep with the plugin (a newer
# ui-utils.hx/repl-ui.hx API would break nrepl.scm's requires). Bump these
# whenever sulafat bumps its cog.scm dependency pins.
[ui-utils-hx]
src.manual = "3262e80706f9d332b83d3ac0f578ffd40e2e0673"
fetch.git = "https://github.com/waddie/ui-utils.hx"

[repl-ui-hx]
src.manual = "8d21aee4114222f0ce708d1c146598a1ce7ae621"
fetch.git = "https://github.com/waddie/repl-ui.hx"

[run-command]
src.manual = "ed42a376c4761e10530981c34797e7dde8e5abef"
fetch.git = "https://github.com/waddie/run-command.scm"

